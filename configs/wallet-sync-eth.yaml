poll_interval_ms: 1000
# start_height: 0  # optional backfill start (first block to sync on a fresh DB)
# How many blocks to fetch from the RPC in parallel per tick. Tune to
# roughly the number of healthy endpoints you have, or whatever the
# gateway's per-endpoint QPS ceiling allows. 4 is enough for ~12s ETH
# mainnet; bump it to 8-16 for high-BPS chains (Arbitrum/Base/OP/Polygon).
block_fetch_concurrency: 4
database:
  url: "postgres://postgres:postgres@127.0.0.1:5432/wallet_core_dev"
redis:
  url: "redis://127.0.0.1:6379"
nats:
  url: "nats://127.0.0.1:4222"
chain:
  chain_index: 60
  family: evm
  evm_chain_id: 1
  confirmations: 12
  endpoints:
    - url: "http://127.0.0.1:8545/rpc/eth/gw_52f5c01bf1e840c4b1c8ea9e130c690e"
      weight: 1
    - url: "https://ethereum-rpc.publicnode.com"
      weight: 1
    - url: "https://eth.llamarpc.com"
      weight: 1
