# TON wallet sync config using v3 API (paid, full features)
#
# NOTE: toncenter v3 (/api/v3/...) is an indexed REST API and does NOT accept
# the JSON-RPC methods wallet-chain calls (getMasterchainInfo, lookupBlock,
# shards, getBlockTransactionsExt) — `https://toncenter.com/api/v3/jsonRPC`
# returns "Method Not Allowed". The TON driver currently only speaks toncenter
# v2-style JSON-RPC, so this config points at a working v2 endpoint while
# keeping `ton_api_version: 3` to exercise that code path.

poll_interval_ms: 5000
block_fetch_concurrency: 4

database:
  url: "postgres://postgres:postgres@127.0.0.1:5432/wallet"

redis:
  url: "redis://127.0.0.1:6379"

nats:
  url: "nats://127.0.0.1:4222"

chain:
  chain_index: 607
  family: ton
  # TON API version: 2, 3, or 4
  # v2/v3/v4 currently all select the same v2-style JSON-RPC surface; only
  # endpoints whose path contains /jsonRPC are usable.
  ton_api_version: 3
  confirmations: 5

  endpoints:
    - url: "https://toncenter.com/api/v2/jsonRPC"
      weight: 1
