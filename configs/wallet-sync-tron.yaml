poll_interval_ms: 1000
# start_height: 0  # optional backfill start (first block to sync on a fresh DB)
# Concurrency for Tron blocks. Each Tron block contains ~200-500 txs with receipts;
# concurrency 2 avoids hitting upstream QPS rate-limits while keeping throughput high.
block_fetch_concurrency: 2
database:
  url: "postgres://postgres:postgres@127.0.0.1:5432/wallet_core_dev"
redis:
  url: "redis://127.0.0.1:6379"
nats:
  url: "nats://127.0.0.1:4222"
chain:
  chain_index: 195
  family: tron
  confirmations: 12
  endpoints:
    - url: "grpc://127.0.0.1:50051/rpc/tron/gw_52f5c01bf1e840c4b1c8ea9e130c690e"
      weight: 1
