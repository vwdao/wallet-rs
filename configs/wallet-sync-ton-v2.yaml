# TON wallet sync config using v2 API (public, limited features)
# Use this when connecting to toncenter public RPC or other v2-compatible endpoints

poll_interval_ms: 5000
block_fetch_concurrency: 4

database:
  url: "postgres://postgres:postgres@127.0.0.1:5432/wallet"

redis:
  url: "redis://127.0.0.1:6379"

nats:
  url: "nats://127.0.0.1:4222"

chain:
  chain_index: 607
  family: ton
  # TON API version: 2, 3, or 4
  # Only toncenter v2-style JSON-RPC endpoints are currently supported
  # (https://toncenter.com/api/v2/jsonRPC). toncenter v3 (/api/v3/...) is an
  # indexed REST API that rejects the JSON-RPC methods wallet-chain calls, so
  # it never passes the health probe. v3/v4 in config select the same v2
  # JSON-RPC surface for now.
  ton_api_version: 2
  confirmations: 5

  endpoints:
    - url: "https://toncenter.com/api/v2/jsonRPC"
      weight: 1
