poll_interval_ms: 5000
# start_height: 0  # optional backfill start (first masterchain seqno to sync on a fresh DB)
# How many masterchain blocks to fetch from the RPC in parallel per tick.
# Each height now costs several RPCs (lookupBlock + shards + paginated
# getBlockTransactionsExt per shard). ZAN/toncenter public tiers rate-limit
# hard around a few RPS, so keep this at 1-2 for a single endpoint.
block_fetch_concurrency: 1
database:
  url: "postgres://postgres:postgres@127.0.0.1:5432/wallet"
redis:
  url: "redis://127.0.0.1:6379"
nats:
  url: "nats://127.0.0.1:4222"
chain:
  chain_index: 607
  family: ton
  # TON API version: 2, 3, or 4
  # Only toncenter v2-style JSON-RPC endpoints work today (path contains
  # `/jsonRPC`, e.g. `.../api/v2/jsonRPC`); wallet-chain uses
  # getBlockTransactionsExt + shards against them. toncenter v3 (/api/v3/...)
  # is an indexed REST API and never passes the health probe. v3/v4 in config
  # select the same v2 JSON-RPC surface for now.
  ton_api_version: 2
  # Masterchain block finality is reached after ~5 masterchain blocks
  # (~25s on TON mainnet). Setting confirmations slightly higher absorbs
  # the round-trip to the chain-gateway without slowing down syncing.
  confirmations: 5
  endpoints:
    # chain-gateway routes `/rpc/ton/...` to TON JSON-RPC endpoints (see
    # `wallet-chain-gateway` configs). The default `gw_xxx` token is the
    # gateway-issued tenant id; rotate in production.
    # - url: "https://api.zan.top/node/v1/ton/mainnet/b49c38feccc54a49a318db163d336c60/api/v2/jsonRPC"
    - url: "http://127.0.0.1:8545/rpc/ton/gw_5a6ce3f0795246bc9d5b938e5af8a399"
      weight: 1
