listen: "0.0.0.0:8545"
grpc_listen: "0.0.0.0:50051"
database:
  url: "postgres://postgres:postgres@127.0.0.1:5432/wallet"
redis:
  url: "redis://127.0.0.1:6379"
health_check_interval_ms: 30000
failure_threshold: 3
admin_username: "admin"
# Set GATEWAY_ADMIN_PASSWORD / GATEWAY_ADMIN_KEY env vars in production.
admin_password: "change-me"
admin_key: ""
stats_batch_interval_ms: 1000
log_requests: true
