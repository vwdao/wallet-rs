apiVersion: v1
kind: ConfigMap
metadata:
  name: apigw-app-cm
  namespace: wallet
data:
  apigw-app.yaml.tmpl: |
    listen: "0.0.0.0:8080"
    grpc_endpoint: "http://wallet-api:9000"
    jwt:
      secret: "${JWT_SECRET}"
      issuer: "${JWT_ISSUER}"
  start.sh: |
    #!/bin/sh
    envsubst < /etc/wallet-template/apigw-app.yaml.tmpl > /tmp/cfg.yaml
    exec /app/wallet-apigw-app --config /tmp/cfg.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-apigw-app
  namespace: wallet
  labels:
    app: wallet-apigw-app
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-apigw-app
  template:
    metadata:
      labels:
        app: wallet-apigw-app
        tier: frontend
    spec:
      containers:
        - name: wallet-apigw-app
          image: wallet:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/start.sh"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RUST_LOG
              value: "info"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: JWT_SECRET
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: JWT_ISSUER
          volumeMounts:
            - name: config-template
              mountPath: /etc/wallet-template
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /tmp/cfg.yaml
              subPath: cfg.yaml
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config-template
          configMap:
            name: apigw-app-cm
            items:
              - key: apigw-app.yaml.tmpl
                path: apigw-app.yaml.tmpl
        - name: scripts
          configMap:
            name: apigw-app-cm
            items:
              - key: start.sh
                path: start.sh
                mode: 0755
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-apigw-app
  namespace: wallet
spec:
  selector:
    app: wallet-apigw-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
