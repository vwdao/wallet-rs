apiVersion: v1
kind: ConfigMap
metadata:
  name: apigw-admin-cm
  namespace: wallet
data:
  apigw-admin.yaml.tmpl: |
    listen: "0.0.0.0:8081"
    grpc_endpoint: "http://wallet-api:9000"
    jwt:
      secret: "${ADMIN_JWT_SECRET}"
      issuer: "${ADMIN_JWT_ISSUER}"
  start.sh: |
    #!/bin/sh
    envsubst < /etc/wallet-template/apigw-admin.yaml.tmpl > /tmp/cfg.yaml
    exec /app/wallet-apigw-admin --config /tmp/cfg.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-apigw-admin
  namespace: wallet
  labels:
    app: wallet-apigw-admin
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-apigw-admin
  template:
    metadata:
      labels:
        app: wallet-apigw-admin
        tier: frontend
    spec:
      containers:
        - name: wallet-apigw-admin
          image: wallet:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/start.sh"]
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: RUST_LOG
              value: "info"
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: ADMIN_JWT_SECRET
            - name: ADMIN_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: ADMIN_JWT_ISSUER
          volumeMounts:
            - name: config-template
              mountPath: /etc/wallet-template
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /tmp/cfg.yaml
              subPath: cfg.yaml
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config-template
          configMap:
            name: apigw-admin-cm
            items:
              - key: apigw-admin.yaml.tmpl
                path: apigw-admin.yaml.tmpl
        - name: scripts
          configMap:
            name: apigw-admin-cm
            items:
              - key: start.sh
                path: start.sh
                mode: 0755
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-apigw-admin
  namespace: wallet
spec:
  selector:
    app: wallet-apigw-admin
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  type: ClusterIP
