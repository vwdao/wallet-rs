apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-sync-cm
  namespace: wallet
data:
  start.sh: |
    #!/bin/sh
    envsubst < /etc/wallet-template/wallet-sync.yaml.tmpl > /tmp/cfg.yaml
    exec /app/wallet-sync --config /tmp/cfg.yaml
---
# ── ETH sync ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-sync-eth-cm
  namespace: wallet
data:
  wallet-sync.yaml.tmpl: |
    chain_index: 60
    poll_interval_ms: 2000
    database:
      url: "postgres://wallet:${POSTGRES_PASSWORD}@postgres:5432/wallet"
    nats:
      url: "nats://nats:4222"
    chain:
      chain_index: 60
      family: evm
      evm_chain_id: 1
      confirmations: 12
      endpoints:
        - url: "${ETH_RPC_URL}"
          weight: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-sync-eth
  namespace: wallet
  labels:
    app: wallet-sync
    chain: eth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-sync
      chain: eth
  template:
    metadata:
      labels:
        app: wallet-sync
        chain: eth
    spec:
      containers:
        - name: wallet-sync
          image: wallet:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/start.sh"]
          env:
            - name: RUST_LOG
              value: "info"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: POSTGRES_PASSWORD
            - name: ETH_RPC_URL
              value: "https://eth.llamarpc.com"
          volumeMounts:
            - name: config-template
              mountPath: /etc/wallet-template
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /tmp/cfg.yaml
              subPath: cfg.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config-template
          configMap:
            name: wallet-sync-eth-cm
        - name: scripts
          configMap:
            name: wallet-sync-cm
            items:
              - key: start.sh
                path: start.sh
                mode: 0755
        - name: config
          emptyDir: {}
---
