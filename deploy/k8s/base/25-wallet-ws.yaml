apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-ws-cm
  namespace: wallet
data:
  wallet-ws.yaml.tmpl: |
    listen: "0.0.0.0:8090"
    nats:
      url: "nats://nats:4222"
  start.sh: |
    #!/bin/sh
    envsubst < /etc/wallet-template/wallet-ws.yaml.tmpl > /tmp/cfg.yaml
    exec /app/wallet-ws --config /tmp/cfg.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-ws
  namespace: wallet
  labels:
    app: wallet-ws
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-ws
  template:
    metadata:
      labels:
        app: wallet-ws
        tier: frontend
    spec:
      containers:
        - name: wallet-ws
          image: wallet:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/start.sh"]
          ports:
            - containerPort: 8090
              name: ws
          env:
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: config-template
              mountPath: /etc/wallet-template
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /tmp/cfg.yaml
              subPath: cfg.yaml
          readinessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config-template
          configMap:
            name: wallet-ws-cm
            items:
              - key: wallet-ws.yaml.tmpl
                path: wallet-ws.yaml.tmpl
        - name: scripts
          configMap:
            name: wallet-ws-cm
            items:
              - key: start.sh
                path: start.sh
                mode: 0755
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-ws
  namespace: wallet
spec:
  selector:
    app: wallet-ws
  ports:
    - port: 8090
      targetPort: 8090
      name: ws
  type: ClusterIP
