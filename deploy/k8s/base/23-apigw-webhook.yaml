apiVersion: v1
kind: ConfigMap
metadata:
  name: apigw-webhook-cm
  namespace: wallet
data:
  apigw-webhook.yaml.tmpl: |
    listen: "0.0.0.0:8082"
    nats:
      url: "nats://nats:4222"
  start.sh: |
    #!/bin/sh
    envsubst < /etc/wallet-template/apigw-webhook.yaml.tmpl > /tmp/cfg.yaml
    exec /app/wallet-apigw-webhook --config /tmp/cfg.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-apigw-webhook
  namespace: wallet
  labels:
    app: wallet-apigw-webhook
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-apigw-webhook
  template:
    metadata:
      labels:
        app: wallet-apigw-webhook
        tier: frontend
    spec:
      containers:
        - name: wallet-apigw-webhook
          image: wallet:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/start.sh"]
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: config-template
              mountPath: /etc/wallet-template
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /tmp/cfg.yaml
              subPath: cfg.yaml
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config-template
          configMap:
            name: apigw-webhook-cm
            items:
              - key: apigw-webhook.yaml.tmpl
                path: apigw-webhook.yaml.tmpl
        - name: scripts
          configMap:
            name: apigw-webhook-cm
            items:
              - key: start.sh
                path: start.sh
                mode: 0755
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-apigw-webhook
  namespace: wallet
spec:
  selector:
    app: wallet-apigw-webhook
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  type: ClusterIP
