apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-api-cm
  namespace: wallet
data:
  wallet-api.yaml.tmpl: |
    listen: "0.0.0.0:9000"
    database:
      url: "postgres://wallet:${POSTGRES_PASSWORD}@postgres:5432/wallet"
      max_connections: 16
    redis:
      url: "redis://redis:6379"
    nats:
      url: "nats://nats:4222"
    clickhouse:
      url: "${CLICKHOUSE_URL}"
      database: "wallet"
    jwt:
      secret: "${JWT_SECRET}"
      issuer: "${JWT_ISSUER}"
    chains:
      - chain_index: 60
        family: evm
        evm_chain_id: 1
        confirmations: 12
        endpoints:
          - url: "${ETH_RPC_URL}"
            weight: 1
      - chain_index: 501
        family: solana
        confirmations: 32
        endpoints:
          - url: "${SOL_RPC_URL}"
            weight: 1
      - chain_index: 0
        family: bitcoin
        confirmations: 3
        endpoints:
          - url: "${BTC_RPC_URL}"
            weight: 1
      - chain_index: 195
        family: tron
        confirmations: 20
        endpoints:
          - url: "${TRON_RPC_URL}"
            weight: 1
  start.sh: |
    #!/bin/sh
    envsubst < /etc/wallet-template/wallet-api.yaml.tmpl > /tmp/wallet-api.yaml
    exec /app/wallet-api --config /tmp/wallet-api.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-api
  namespace: wallet
  labels:
    app: wallet-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-api
  template:
    metadata:
      labels:
        app: wallet-api
        tier: backend
    spec:
      containers:
        - name: wallet-api
          image: wallet:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/start.sh"]
          ports:
            - containerPort: 9000
              name: grpc
          env:
            - name: RUST_LOG
              value: "info"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: JWT_SECRET
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: JWT_ISSUER
            - name: ETH_RPC_URL
              value: "https://eth.llamarpc.com"
            - name: SOL_RPC_URL
              value: "https://api.mainnet-beta.solana.com"
            - name: BTC_RPC_URL
              value: "https://blockstream.info/api"
            - name: TRON_RPC_URL
              value: "https://api.trongrid.io"
            - name: CLICKHOUSE_URL
              value: ""
          volumeMounts:
            - name: config-template
              mountPath: /etc/wallet-template
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /tmp/wallet-api.yaml
              subPath: wallet-api.yaml
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config-template
          configMap:
            name: wallet-api-cm
            items:
              - key: wallet-api.yaml.tmpl
                path: wallet-api.yaml.tmpl
        - name: scripts
          configMap:
            name: wallet-api-cm
            items:
              - key: start.sh
                path: start.sh
                mode: 0755
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-api
  namespace: wallet
spec:
  selector:
    app: wallet-api
  ports:
    - port: 9000
      targetPort: 9000
      name: grpc
  type: ClusterIP
