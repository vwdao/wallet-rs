apiVersion: v1
kind: ConfigMap
metadata:
  name: chain-gateway-cm
  namespace: wallet
data:
  chain-gateway.yaml.tmpl: |
    listen: "0.0.0.0:8545"
    database:
      url: "postgres://wallet:${POSTGRES_PASSWORD}@postgres:5432/wallet"
    redis:
      url: "redis://redis:6379"
    health_check_interval_ms: 30000
    failure_threshold: 3
    admin_key: "${CHAIN_GW_ADMIN_KEY}"
  start.sh: |
    #!/bin/sh
    envsubst < /etc/wallet-template/chain-gateway.yaml.tmpl > /tmp/cfg.yaml
    exec /app/wallet-chain-gateway --config /tmp/cfg.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-chain-gateway
  namespace: wallet
  labels:
    app: wallet-chain-gateway
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-chain-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: wallet-chain-gateway
        tier: backend
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: wallet-chain-gateway
          image: wallet:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/start.sh"]
          ports:
            - containerPort: 8545
              name: http
          env:
            - name: RUST_LOG
              value: "info"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: POSTGRES_PASSWORD
            - name: CHAIN_GW_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: CHAIN_GW_ADMIN_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8545
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8545
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8545
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: config-template
              mountPath: /etc/wallet-template
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /tmp/cfg.yaml
              subPath: cfg.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config-template
          configMap:
            name: chain-gateway-cm
            items:
              - key: chain-gateway.yaml.tmpl
                path: chain-gateway.yaml.tmpl
        - name: scripts
          configMap:
            name: chain-gateway-cm
            items:
              - key: start.sh
                path: start.sh
                mode: 0755
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-chain-gateway
  namespace: wallet
spec:
  selector:
    app: wallet-chain-gateway
  ports:
    - port: 8545
      targetPort: 8545
      name: http
  type: ClusterIP
